<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kapri — AI Shopping Concierge</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(120% 80% at 50% 0%, var(--purple-100) 0%, var(--surface) 55%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  /* App shell — phone-shaped on desktop, full-bleed on small screens */
  .app {
    width: 100%;
    max-width: 460px;
    height: 100dvh;
    max-height: 920px;
    background: var(--surface);
    overflow: hidden;
    box-shadow: var(--shadow-xl);
    position: relative;
  }
  @media (min-width: 520px) {
    body { padding: 24px; }
    .app { border-radius: var(--radius-xl); height: min(880px, calc(100dvh - 48px)); border: 1px solid var(--line); }
  }
  #root { height: 100%; }
</style>
</head>
<body>
  <div class="app"><div id="root"></div></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="Parts.jsx"></script>
  <script type="text/babel" src="GenUI.jsx"></script>
  <script type="text/babel" src="App.jsx"></script>
</body>
</html>
