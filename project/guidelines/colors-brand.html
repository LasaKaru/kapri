<!-- @dsCard group="Colors" viewport="700x190" name="Brand colors" subtitle="Purple structure, yellow spark, white ground" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--surface-app); }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--line); }
  .chip { height: 76px; display: flex; align-items: flex-end; padding: 8px; }
  .meta { background: var(--white); padding: 8px 10px; }
  .name { font-family: var(--font-sans); font-weight: 700; font-size: 13px; color: var(--ink); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-top: 2px; }
  .tag { font-family: var(--font-sans); font-size: 10px; font-weight: 600; letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
</style>
</head>
<body>
  <div class="tag">Two pillars + white</div>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--purple-700)"></div><div class="meta"><div class="name">Purple 700</div><div class="hex">#442A73 · brand</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--yellow-400)"></div><div class="meta"><div class="name">Yellow 400</div><div class="hex">#F9DB09 · accent</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--white); border-bottom:1px solid var(--line)"></div><div class="meta"><div class="name">White</div><div class="hex">#FFFFFF · ground</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--surface)"></div><div class="meta"><div class="name">Surface</div><div class="hex">#F6F4FA · app bg</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink)"></div><div class="meta"><div class="name">Ink</div><div class="hex">#1B1230 · text</div></div></div>
  </div>
</body>
</html>
