<!-- @dsCard group="Type" viewport="700x300" name="Type scale" subtitle="Inter · display → micro-label" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); font-family: var(--font-sans); color: var(--ink); }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .spec { width: 120px; flex-shrink: 0; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
  .sample { line-height: 1.15; }
</style>
</head>
<body>
  <div class="row"><span class="spec">2xl · 700</span><span class="sample" style="font-size:24px;font-weight:700;color:var(--purple-700)">Ayubowan! I'm Kapri</span></div>
  <div class="row"><span class="spec">xl · 700</span><span class="sample" style="font-size:20px;font-weight:700">Your Cart (3)</span></div>
  <div class="row"><span class="spec">lg · 700</span><span class="sample" style="font-size:18px;font-weight:700">Order Ready! 🎉</span></div>
  <div class="row"><span class="spec">base · 600</span><span class="sample" style="font-size:16px;font-weight:600">Pay Now on Kapruka</span></div>
  <div class="row"><span class="spec">sm · 400</span><span class="sample" style="font-size:14px">Mata me items hoyagaththa — take a look!</span></div>
  <div class="row"><span class="spec">xs · 500</span><span class="sample" style="font-size:12px;font-weight:500;color:var(--muted)">Flat delivery fee per order</span></div>
  <div class="row"><span class="spec">2xs · 600 ▲</span><span class="sample" style="font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">Categories</span></div>
</body>
</html>
