<!-- @dsCard group="Spacing" viewport="700x170" name="Radii" subtitle="Rounded everything — 8 → full" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--surface-app); font-family: var(--font-sans); }
  .row { display: flex; gap: 18px; align-items: flex-end; }
  .item { text-align: center; }
  .box { width: 78px; height: 64px; background: var(--purple-100); border: 1.5px solid var(--purple-300); }
  .name { font-size: 12px; font-weight: 600; color: var(--ink); margin-top: 8px; }
  .val { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="name">sm</div><div class="val">8px · chips</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="name">md</div><div class="val">14px · buttons</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="name">lg</div><div class="val">20px · cards</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="name">xl</div><div class="val">28px · drawers</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-full)"></div><div class="name">full</div><div class="val">pills · avatars</div></div>
  </div>
</body>
</html>
