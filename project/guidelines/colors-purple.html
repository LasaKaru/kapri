<!-- @dsCard group="Colors" viewport="700x150" name="Purple scale" subtitle="50 → 900 · structure & chrome" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--surface-app); font-family: var(--font-sans); }
  .scale { display: flex; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .step { flex: 1; height: 84px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 6px; }
  .n { font-size: 11px; font-weight: 700; }
  .h { font-family: var(--font-mono); font-size: 9px; opacity: .85; margin-top: 2px; }
  .tag { font-size: 10px; font-weight: 600; letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
</style>
</head>
<body>
  <div class="tag">Purple — primary brand</div>
  <div class="scale">
    <div class="step" style="background:var(--purple-50); color:var(--ink)"><span class="n">50</span><span class="h">F6F4FA</span></div>
    <div class="step" style="background:var(--purple-100); color:var(--ink)"><span class="n">100</span><span class="h">ECE7F3</span></div>
    <div class="step" style="background:var(--purple-200); color:var(--ink)"><span class="n">200</span><span class="h">D3C8E2</span></div>
    <div class="step" style="background:var(--purple-300); color:var(--ink)"><span class="n">300</span><span class="h">AE9BCB</span></div>
    <div class="step" style="background:var(--purple-400); color:#fff"><span class="n">400</span><span class="h">8A72B5</span></div>
    <div class="step" style="background:var(--purple-500); color:#fff"><span class="n">500</span><span class="h">6B4FA0</span></div>
    <div class="step" style="background:var(--purple-600); color:#fff"><span class="n">600</span><span class="h">553A88</span></div>
    <div class="step" style="background:var(--purple-700); color:#fff"><span class="n">700</span><span class="h">442A73</span></div>
    <div class="step" style="background:var(--purple-800); color:#fff"><span class="n">800</span><span class="h">33205C</span></div>
    <div class="step" style="background:var(--purple-900); color:#fff"><span class="n">900</span><span class="h">241544</span></div>
  </div>
</body>
</html>
