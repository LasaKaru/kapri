<!-- @dsCard group="Components" viewport="700x180" name="Badges & Chips" subtitle="Status pills, category tags, quick replies" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); font-family: var(--font-sans); }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .lbl { width: 90px; flex-shrink: 0; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Badge, Chip } = window.DesignSystem_db2035
    function Demo() {
      return (
        <div>
          <div className="row">
            <span className="lbl">Badges</span>
            <Badge tone="accent">3</Badge>
            <Badge tone="purple">Cakes</Badge>
            <Badge tone="success">-20%</Badge>
            <Badge tone="warn">Low Stock</Badge>
            <Badge tone="ink">Out of Stock</Badge>
            <Badge tone="accent">● LIVE</Badge>
            <Badge tone="neutral">CAKE-2291</Badge>
          </div>
          <div className="row">
            <span className="lbl">Quick reply</span>
            <Chip>Show more</Chip>
            <Chip>Under Rs. 3,000</Chip>
            <Chip>In stock only</Chip>
          </div>
          <div className="row">
            <span className="lbl">Refine bar</span>
            <Chip variant="tonal" selected>Relevance</Chip>
            <Chip variant="tonal">Price ↑</Chip>
            <Chip variant="tonal">Price ↓</Chip>
            <Chip variant="tonal">In stock</Chip>
          </div>
        </div>
      )
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />)
  </script>
</body>
</html>
