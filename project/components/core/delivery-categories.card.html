<!-- @dsCard group="Components" viewport="700x230" name="Delivery & categories" subtitle="Delivery status card + category tiles" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--surface-app); font-family: var(--font-sans); }
  .row { display: flex; gap: 20px; align-items: flex-start; }
  .tiles { display: grid; grid-template-columns: repeat(3, 76px); gap: 10px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { DeliveryStatus, CategoryTile } = window.DesignSystem_db2035
    const cats = [['🎂','Cakes'],['🌹','Flowers'],['🍫','Chocolates'],['🧺','Hampers'],['💍','Jewellery'],['🧸','Toys']]
    function Demo() {
      return (
        <div className="row">
          <DeliveryStatus city="Colombo" date="Sat, 14 Jun 2026" available rate={350}
            perishableWarning="Cakes are made fresh — please make sure someone can receive it on the day." />
          <div className="tiles">
            {cats.map(([e,l]) => <CategoryTile key={l} emoji={e} label={l} />)}
          </div>
        </div>
      )
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />)
  </script>
</body>
</html>
